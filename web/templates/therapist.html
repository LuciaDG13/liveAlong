<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LiveAlong</title>
        <link href="../static/css/common.css" rel="stylesheet">
        <link href="../static/css/therapist.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="icon" type="image/svg+xml" href="../static/icons/robot.svg">
    </head>
    <body>
        <header class="header-outer" id="header_id">
            <div class="header-inner responsive-wrapper">
                <div class="header-left">
                    <a href="/" class="header-back" id="header-back-link" data-confirm-logout="true" aria-label="Log out and return to login">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <div class="header-logo">
                        <a href="#" id="link-logo"><img src="../static/images/illustration_robot.png" alt="Logo"/></a>
                    </div>
                    <h1 class="header-name-appli">LiveAlong</h1>
                </div>
                <div class="header-user-status" id="user-status-block">
                    <span id="user-display-name" class="user-name">Loading...</span>
                    <button type="button" id="btn-logout" class="btn-logout">Log out</button>
                </div>
            </div>
        </header>

        <main class="responsive-wrapper">
            <h1 class="page-title">Therapist Interface</h1>
            <div class="button-container">                
                <a type="button" href="/therapist/create_profile" class="btn-nav">Create Profile</a>
                <a type="button" href="/therapist/profiles" class="btn-nav">View Profiles</a>
            </div>
        </main>

        <script type="module" src="../static/js/auth.js"></script>
        <script type= "module">
            import {requireAuth} from "../static/js/auth.js" ;
            requireAuth("therapist")
        </script>

    </body>
</html>
