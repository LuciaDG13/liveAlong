<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LiveAlong</title>
        <link href="../static/css/common.css" rel="stylesheet">
        <link href="../static/css/select-profile.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="icon" type="image/svg+xml" href="../static/icons/robot.svg">
    </head>
    <body>
        <header class="header-outer">
            <div class="header-inner responsive-wrapper">
                <div class="header-left">
                    <a href="/" class="header-back" data-confirm-logout="true" aria-label="Log out and return to login">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <div class="header-logo">
                        <a href="#" id="link-logo"><img src="../static/images/illustration_robot.png" alt="Logo"></a>
                    </div>
                    <h1 class="header-name-appli">LiveAlong</h1>
                </div>
            </div>
        </header>

        <main class="responsive-wrapper">
            <h1 class="page-title">Select Profile</h1>

            <div class="form-group" id="profile-search-wrapper">
                <label for="profile-search">Search by name:</label>
                <input
                    type="text"
                    id="profile-search"
                    name="profile-search"
                    placeholder="Start typing a name..."
                    autocomplete="off"
                >
            </div>

            <div id="profile-list" class="profile-list" aria-live="polite">
                <p class="profile-list-message">Loading profiles...</p>
            </div>

            <section id="profile-detail" class="profile-detail hidden" aria-live="polite">
                <p class="profile-list-message">Select a profile to view its recap and conversation history.</p>
            </section>
        </main>

        <button type="button" id="btn-scroll-top" class="btn-scroll-top hidden" aria-label="Back to top">
            <i class="bi bi-arrow-up"></i>
        </button>

        <div id="app-nav-bar">
            <div id="nav-center">
                <a href="/therapist/profiles" class="tab-nav-btn is-active">
                    <i class="bi bi-people-fill"></i>
                    <span>Profiles</span>
                </a>
                <a href="/therapist/create_profile" class="tab-nav-btn">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>Create Profile</span>
                </a>
            </div>
        </div>

        <script src="../static/js/select-profile.js"></script>
        <script type="module" src="../static/js/auth.js"></script>
        <script type="module">
            import { requireAuth } from "../static/js/auth.js";
            requireAuth("therapist");
        </script>
    </body>
</html>
