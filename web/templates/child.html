<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>LiveAlong</title>
        <link href = "../static/css/child.css" rel = "stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="icon" type="image/svg+xml" href="../static/icons/robot.svg">
    </head>
   <body>
        <header class = "header-outer" id="header_id">
            <div class="header-inner responsive-wrapper">
                <div class = "header-logo">
                    <img src="../static/images/illustration_robot.png"/>                    
                </div>
                <h1 class = "header-name-appli">LiveAlong</h1>                
            </div>         
        </header>

        <div id="main-area">
            <main id="chat-box">
                <div id="last-message"></div>
            </main>

            <section id="response-zone" class="hidden">
                <div id="response-top">
                    <div id="selected-pictograms"></div>
                    <div class="buttons" id="buttons-pict" hidden>
                        <button class="button-confirm" id="button-confirm-pict">✓</button>
                        <button class="button-cancel" id="button-cancel-pict">✗</button>
                    </div>
                    <div style="text-align:center;padding:8px;">
                        <button id="btn-micro" class="bi bi-mic" hidden></button>
                    </div>
                    <div id="preview-voice" hidden>
                        <p id="preview-text"></p>
                        <button class="button-confirm" id="btn-confirm-voice">✓</button>
                        <button class="button-cancel" id="btn-cancel-voice">✗</button>
                    </div>
                </div>
                <div class="container-fluid" id="response-bottom">
                    <div class="row" id="pictogram_grid"></div>
                </div>
            </section>
        </div>

        <div id="nav-bar">
            <div id="nav-left">
                <button id="btn-back" class="bi bi-arrow-left-circle-fill hidden"></button>
            </div>
            <div id="nav-center">
                <button id="btn-end-session">End</button>
                <button id="btn-home" onclick="window.location.href='/'">Home</button>
            </div>
            <div id="nav-right">
                <button id="btn-next" class="bi bi-arrow-right-circle-fill"></button>
            </div>
        </div>
