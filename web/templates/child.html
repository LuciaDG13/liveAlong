<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>LiveAlong</title>
        <link href="../static/css/common.css" rel="stylesheet">
        <link href = "../static/css/child.css" rel = "stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="icon" type="image/svg+xml" href="../static/icons/robot.svg">
    </head>
    <body>
        <header class="header-outer">
            <div class="header-inner responsive-wrapper">
                <div class="header-left">
                    <a href="/" class="header-back" data-confirm-logout="true" aria-label="Log out and return to login">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <div class="header-logo">
                        <a href="#" id="link-logo"><img src="../static/images/illustration_robot.png" alt="Logo"></a>
                    </div>
                    <h1 class="header-name-appli">LiveAlong</h1>
                </div>
            </div>
        </header>

        <main id="tab-content">
            <section id="tab-home" class="tab-pane active-tab">
                <section id="emotion-checkin">
                    <h2>How are you feeling today ?</h2>
                    <div id="emotion-checkin-grid" class="emotion-checkin-grid"></div>
                </section>
            </section>

            <section id="tab-chat" class="tab-pane">
                <section id="chat-placeholder">
                    <i class="bi bi-chat-heart"></i>
                    <p>Check in on the Home tab to start today's activity.</p>
                </section>

                <section id="session-loading" hidden>
                    <i class="bi bi-hourglass-split"></i>
                    <p>Preparing your session...</p>
                </section>

                <div id="main-area" hidden>
                    <section id="usage-nudge-banner" hidden>
                        <p>You've practiced a lot today. It's okay to take a break whenever you want.</p>
                        <button type="button" id="btn-dismiss-usage-nudge">OK</button>
                    </section>

                    <div class="chat-topbar">
                        <button type="button" id="btn-end-session" class="btn-end-chip">
                            👋 See you
                        </button>
                    </div>

                    <section id="avatar-zone">
                        <div id="avatar-container">
                            <audio id="avatar-audio" hidden></audio>
                        </div>
                    </section>

                    <section id="mic-zone">
                        <div id="selected-pictograms"></div>
                        <div id="buttons-pict">
                            <button class="button-confirm" id="button-confirm-pict">✓</button>
                            <button class="button-cancel" id="button-cancel-pict">✗</button>
                        </div>
                        <button id="btn-micro" class="bi bi-mic"></button>
                    </section>

                    <section id="pictogram-zone">
                        <div id="pictogram-core-bar" class="pictogram-core-bar"></div>
                        <div id="pictogram-category-tabs" class="pictogram-category-tabs"></div>
                        <div id="pictogram_grid" class="pictogram-grid"></div>
                    </section>

                    <section id="end-screen" hidden>
                        <p id="end-screen-message">See you later ! 👋</p>
                        <button type="button" id="btn-new-conversation" class="btn-nav">New chat</button>
                    </section>
                </div>
            </section>

            <section id="tab-progress" class="tab-pane">
                <div class="progress-panel-header">
                    <div>
                        <h2>My Progress</h2>
                        <span id="user-display-name" class="progress-panel-subtitle"></span>
                    </div>
                </div>
                <div class="progress-section">
                    <h3>Activities I've practiced</h3>
                    <div id="progress-activities"></div>
                </div>
                <div class="progress-section">
                    <h3>Skills I'm growing</h3>
                    <div id="progress-skills" class="badge-row"></div>
                </div>
            </section>
        </main>

        <div id="app-nav-bar">
            <div id="nav-center">
                <button type="button" class="tab-nav-btn is-active" data-tab="home">
                    <i class="bi bi-house-door-fill"></i>
                    <span>Home</span>
                </button>
                <button type="button" class="tab-nav-btn" data-tab="chat">
                    <i class="bi bi-chat-dots-fill"></i>
                    <span>Chat</span>
                </button>
                <button type="button" class="tab-nav-btn" data-tab="progress">
                    <i class="bi bi-star-fill"></i>
                    <span>Progress</span>
                </button>
            </div>
        </div>

        <script src="../static/js/avatar-speech-sync.js"></script>
        <script src="../static/js/api.js"></script>
        <script src="../static/js/pictograms.js"></script>
        <script src="../static/js/speech.js"></script>
        <script src="../static/js/child.js"></script>
        <script type="module" src="../static/js/auth.js"></script>
        <script type="module">
            import { requireAuth } from "../static/js/auth.js";
            requireAuth("child");
        </script>
    </body>
</html>
