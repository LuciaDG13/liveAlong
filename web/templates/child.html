<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>LiveAlong</title>
        <link href="../static/css/common.css" rel="stylesheet">
        <link href = "../static/css/child.css" rel = "stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="icon" type="image/svg+xml" href="../static/icons/robot.svg">
    </head>
    <body>
        <header class="header-outer">
            <div class="header-inner responsive-wrapper">
                <div class="header-left">
                    <a href="/" class="header-back" data-confirm-logout="true" aria-label="Log out and return to login">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <div class="header-logo">
                        <a href="#" id="link-logo"><img src="../static/images/illustration_robot.png" alt="Logo"></a>
                    </div>
                    <h1 class="header-name-appli">LiveAlong</h1>
                </div>
                <div class="header-user-status">
                    <span id="user-display-name" class="user-name">Loading...</span>
                    <button type="button" id="btn-logout" class="btn-logout">Log out</button>
                </div>
            </div>
        </header>

        <div id="main-area">
            <section id="avatar-zone">
                <div id="avatar-container">
                    <audio id="avatar-audio" hidden></audio>
                </div>
            </section>

            <section id="mic-zone">
                <div id="selected-pictograms"></div>
                <div id="buttons-pict">
                    <button class="button-confirm" id="button-confirm-pict">✓</button>
                    <button class="button-cancel" id="button-cancel-pict">✗</button>
                </div>
                <button id="btn-micro" class="bi bi-mic"></button>
            </section>

            <section id="pictogram-zone">
                <div class="container-fluid" id="response-bottom">
                    <div class="row" id="pictogram_grid"></div>
                </div>
            </section>

            <section id="end-screen" hidden>
                <p id="end-screen-message">See you later ! 👋</p>
                <button type="button" id="btn-new-conversation" class="btn-nav">New chat</button>
            </section>
        </div>

        <div id="nav-bar">
            <div id="nav-center">
                <button id="btn-end-session" style="background-color: #E2ECF7; color: #2C5282; border: 1.5px solid #BEE3F8; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; height: 48px; padding: 0 16px; font-weight: 600;">
                    <i class="bi bi-hand-wave-fill"></i> See you
                </button>
                <button id="btn-home" onclick="window.location.href='/'" style="background-color: var(--color-accent-soft); color: var(--color-accent); border: 1.5px solid rgba(74, 117, 105, 0.2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; height: 48px; padding: 0 16px; font-weight: 600;">
                    <i class="bi bi-house-door-fill"></i> Home Page
                </button>
            </div>
        </div>

        <script src="../static/js/avatar-speech-sync.js"></script>
        <script src="../static/js/api.js"></script>
        <script src="../static/js/pictograms.js"></script>
        <script src="../static/js/speech.js"></script>
        <script src="../static/js/child.js"></script>
        <script type="module" src="../static/js/auth.js"></script>
        <script type="module">
            import { requireAuth } from "../static/js/auth.js";
            requireAuth("child");
        </script>
    </body>
</html>
