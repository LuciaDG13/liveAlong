<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>LiveAlong</title>
        <link href="../static/css/common.css" rel="stylesheet">
        <link href = "../static/css/login.css" rel = "stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="icon" type="image/svg+xml" href="../static/icons/robot.svg">
    </head>
   <body>
        <header class="header-outer">
            <div class="header-inner responsive-wrapper">
                <div class = "header-logo">
                    <img src="../static/images/illustration_robot.png"/>                    
                </div>
                <h1>LiveAlong</h1>                
            </div>         
        </header>
        <section class="responsive-wrapper">
            <h1 class="connection">Connection</h1>
            
            <div class="form-container">
                <p>Please complete this information to connect to your account.</p>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" placeholder="john.doe@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
            </div>
            <div class="button-container">
                <button type="button" class="btn-login" id="login-button">Login</button>
            </div>
        </section>
    </body>
    <script type="module" src="../static/js/login.js"></script>
</html>
